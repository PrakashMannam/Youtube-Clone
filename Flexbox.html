<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container{
      display: flex;
      width: 550px;
      border: 1px solid grey;
      justify-content: space-between;
      height: 30px;
      background-color:rgb(169, 136, 240);
      font-weight: 700;
      color: white;
      flex: 1;
    }
    .home{
      text-align: justify;
      margin-top: 3px;
      margin-left: 8px;
      font-size: 15px;
    }
    .search{
      border-radius: 20px;
      border: 1px none;
      width: 300px;
      margin-top: 5px;
      padding-top: 2px;
      padding-bottom: 2px;
      padding-left: 8px;
    }
    .btn{
      background: none;
      border:  1px solid white;
      margin-top: 5px;
      color: white;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="home">Home</div>
    <div class="search-bar">
      <input class="search" type="text" placeholder="Search">
    </div>
    <div class="download">
      <button class="btn">Download</button>
    </div>
  </div>
</body>
</html>
