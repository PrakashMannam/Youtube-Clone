  <style>
    .Friends-Container {
      white-space: nowrap;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
    }
    .Add-Friend {
      width: 215px;
      height: 310px;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
      display: inline-block;
      margin: 8px;
      vertical-align: top;
    }
    .Sundar-Pichai {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .Details {
      padding: 10px;
    }
    .Name {
      font-weight: bold;
      margin: 4px 0 1px 0;
      font-family: Arial, sans-serif;
    }
    .Mutual {
      margin: 0;
      font-family: Arial;
      color: gray;
    }
    .Addbtn {
      background-color: #1877f2;
      color: white;
      padding: 10px 12px;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
    }
    .Addbtn:hover {
      background-color: #145dbf;
    }
  </style>
</head>
