<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .p {
      margin-top: 0;
      margin-bottom: 0;
    }

    .Container {
      width: 430px;
      font-size: opx;
      border: 1px solid rgb(189, 187, 187);
    }

    .info {
      width: 200px;
      display: inline-block;
      vertical-align: top;
    }

    .Profile {
      display: inline-block;
      border-radius: 50%;
      width: 90px;
      height: 90px;
    }

    .profile {
      display: inline-block;
      margin-top: 15px;
      margin-right: 10px;
      margin-left: 10px;
      vertical-align: top;
    }

    .username,
    .name,
    .type {
      font-size: 24px;
      line-height: 10px;
      font-family: Arial;
      vertical-align: top;
    }

    .username {
      font-weight: bold;
    }

    .name,
    .type {
      color: gray;
    }

    .button {
      display: inline-block;
      vertical-align: middle;
      background: lightyellow;
      width: 60px;
      text-align: center;
      margin-top: 35px;
      margin-left: 10px;
    }

    .follow-btn {
      width: 90px;
      height: 50px;
      background-color: #1DA1F2;
      border: none;
      border-radius: 7px;
      color: white;
      font-size: 20px;
      padding: 3px 5px;
      font-weight: bold;
    }
    .follow-btn:hover{
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="Container">
    <div class="profile">
      <img class="Profile" src="Channel Profiles/channel-1.jpeg" alt="">
    </div>
    <div class="info">
      <p class="username">oliver</p>
      <p class="name">the cat</p>
      <p class="type">Popular</p>
    </div>
    <div class="button">
      <button class="follow-btn">Follow</button>
    </div>
  </div>
</body>

</html>
