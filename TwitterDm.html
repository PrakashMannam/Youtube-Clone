<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <Style>
    .Twitter-Dm{
      display: inline-block;
      padding: 10px 20px;
      border: 1px solid rgb(220, 211, 211);
      box-shadow: 3px 3px 5px rgb(98, 85, 85);
      width: 300px;
    }
    .Image{
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 50%;
      padding-left: 10px;
      padding-right: 4px;
    }
    .input{
      display: inline-block;
      vertical-align: top;
      padding-top: 15px;
      padding-bottom: 10px;
      border: none;
      outline: none;
    }
    .Tweet{
      vertical-align:top;
      margin-top: 12px;
      border-radius: 20px;
      font-size: 18px;
      border:none;
      background-color: #1da1f2;
      color: white;
      font-weight: bold;
    }

  </Style>
</head>
<body>
  <div class="Twitter-Dm">
    <img class="Image" src="Intro-Html/download.png">
    <input class="input" type="text" placeholder="What's happening?">
    <button class="Tweet">Tweet</button>
  </div>
</body>
</html>
