<!DOCTYPE html>
<html lang="en">
<head>
  <title>Modal</title>
  <Style>
    body{
      height: 3000px;
    }
    .right-sidebar {
  background-color: green;
  color: white;
  position: fixed;
  right: 0;
  top: 0;
  bottom: 0;
  width: 100px;
}
.overlay{
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  background-color: rgba(0, 0, 0, 0.8);
  display: flex;
  justify-content: center;
  align-items: center;
}
.modal {
  background-color: white;
  width: 300px;
  padding-top: 15px;
  padding-bottom: 15px;
  padding-left: 15px;
  padding-right: 15px;
  border-radius: 5px;
}
  </Style>
</head>
<body>
  <div class="container">
    <div class="right-sidebar">right side-bar</div>
  </div>
  <div class="overlay">
  <div class="modal">
    <h2>Modal title</h2>
    <p>This is a modal</p>
      <button class="button"> Close</button>
    </div>
    </div>
  </div>
</body>
</html>
