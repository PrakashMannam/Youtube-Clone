<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ride</title>
  <style>
    .P{
      font-size: 30px;
      font-family: Tahoma;
    }
    .Pickup{
      border: none ;
      background-color: rgb(238, 234, 234);
      color: gray;
      box-shadow: inset;
      padding: 10px 30px 5px 5px;
      display: block;
      border-radius: 5px;
      margin-bottom: 5PX;
      cursor: pointer;
    }
    .Destination{
      border: none ;
      background-color: rgb(238, 234, 234);
      color: gray;
      box-shadow: inset;
      padding: 10px 30px 5px 5px;
      display: block;
      border-radius: 5px;
      margin-bottom: 25PX;
      cursor: pointer;
    }
    .Request{
      color: aliceblue;
      background-color: black;
      font-weight: lighter;
      padding: 8px 8px 8px 8px;
      margin-right: 10px;
      cursor: pointer;
    }
    .Schedule{
      background-color: rgb(238, 234, 234);
      border: none ;
      padding: 10px 8px 10px 10px;
      display: inline-block;
      font-weight: 10px;
    }
  </style>
</head>
<body>
  <p class="P">Request a ride now</p>
  <input type="text" class="Pickup" placeholder="Enter pickup location">
  <input type="text" class="Destination" placeholder="Enter Destination">
  <button class="Request">Request now</button>
  <button class="Schedule">Schedule for later</button>
</body>
</html>
